kind = "web"
previewPath = "/"
title = "PH Navigator"
version = "1.0.0"
id = "artifacts/ph-navigator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24187

[services.development]
run = "pnpm --filter @workspace/ph-navigator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ph-navigator", "run", "build" ]
publicDir = "artifacts/ph-navigator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24187"
BASE_PATH = "/"
